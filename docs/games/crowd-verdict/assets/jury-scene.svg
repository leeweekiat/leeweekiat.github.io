<svg xmlns="http://www.w3.org/2000/svg" width="600" height="380" viewBox="0 0 600 380" role="img" aria-labelledby="scene-title scene-desc">
<title id="scene-title">A small jury, a big decision</title>
<desc id="scene-desc">Four friendly animal jurors gather around a second-hand camera and a magnifying glass. Teal and coral ballot cards float above them, with fictional tokens on the table.</desc>
<style>
  .inspection-glass {
    transform-box: view-box;
    transform-origin: 351px 236px;
    animation: inspect-evidence 7s ease-in-out infinite;
  }
  @keyframes inspect-evidence {
    0%, 100% { transform: translate(0, 0) rotate(0deg); }
    28% { transform: translate(-36px, -12px) rotate(-7deg); }
    55% { transform: translate(-54px, 0) rotate(3deg); }
    80% { transform: translate(-18px, 8px) rotate(5deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .inspection-glass { animation: none; transform: none; }
  }
</style>
