<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="marketplace-title marketplace-desc">
  <title id="marketplace-title">A small marketplace, three different perspectives</title>
  <desc id="marketplace-desc">An otter lead worker, a cat secondary worker and a rabbit client gather around a mint marketplace hub. Floating task cards, an approval request, green permission checks and a purple dotted connection represent the different paths a job can take.</desc>
  <style>
    .market-signal { display: none; }
    @supports (offset-path: path("M0 0L1 1")) {
      .market-signal {
        display: inline;
        offset-path: path("M795 176C730 100 647 121 558 189C520 219 480 240 425 242C359 211 316 220 265 269C223 288 238 321 283 345C380 406 526 419 637 369C675 349 684 319 659 290C642 261 613 251 564 260C534 246 536 211 558 189C647 121 730 100 795 176Z");
        offset-anchor: 0px 0px;
        offset-rotate: 0deg;
        animation: marketplace-circuit 12s linear infinite;
      }
    }
    @keyframes marketplace-circuit {
      from { offset-distance: 0%; }
      to { offset-distance: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .market-signal { display: none; animation: none; }
    }
  </style>
  <defs>
    <radialGradient id="signal-glow">
      <stop offset="0" stop-color="#fff5ba" stop-opacity=".95"/>
      <stop offset=".4" stop-color="#ffe6a0" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffe6a0" stop-opacity="0"/>
    </radialGradient>
