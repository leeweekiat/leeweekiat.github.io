<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" role="img" aria-labelledby="city-title city-desc">
  <title id="city-title">The Dispatch Dash neighbourhood</title>
  <desc id="city-desc">A friendly, illustrated city with a connected grid of five north–south roads and four east–west roads. Shops, homes, gardens and a central park sit safely inside the blocks. All twenty road junctions are clear for restaurant, customer and courier markers.</desc>
  <defs>
    <pattern id="grass" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="m5 12 2-3 2 3m10 8 1-2 1 2" fill="none" stroke="#c6dfc2" stroke-width="1.2" stroke-linecap="round"/>
    </pattern>
    <g id="tree">
      <ellipse cx="2" cy="10" rx="13" ry="6" fill="#284e4312"/>
      <path d="M0 2v12" fill="none" stroke="#729278" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-11 0c-7-12 0-21 9-18 7-8 20 0 16 10 9 8-1 19-11 14-8 4-16 0-14-6Z" fill="#add3af" stroke="#77a783" stroke-width="2"/>
    </g>
    <g id="little-tree">
      <path d="M0 0v11" fill="none" stroke="#80a084" stroke-width="3" stroke-linecap="round"/>
      <circle cy="-5" r="10" fill="#c0dcb3" stroke="#91b58b" stroke-width="2"/>
    </g>
    <g id="bench" stroke="#8da290" stroke-width="2.5" stroke-linecap="round">
      <path d="M-12-5h24m-24 6h24m-20 0v6m16-6v6"/>
    </g>
    <g id="home">
      <rect x="-23" y="-14" width="46" height="43" rx="5" fill="#244e4310" transform="translate(3 4)"/>
      <rect x="-23" y="-14" width="46" height="43" rx="5" fill="#fffaf0" stroke="#9aae9c" stroke-width="2"/>
      <path d="m-29-10 29-22 29 22Z" fill="#e7bca4" stroke="#a88c75" stroke-width="2.3" stroke-linejoin="round"/>
      <path d="M-5 29V10H7v19" fill="#acc8b8" stroke="#8fa694" stroke-width="1.7"/>
      <rect x="-16" y="2" width="8" height="9" rx="1.5" fill="#d2e5df" stroke="#95b7ad" stroke-width="1.5"/>
      <rect x="12" y="2" width="8" height="9" rx="1.5" fill="#d2e5df" stroke="#95b7ad" stroke-width="1.5"/>
    </g>
    <g id="shop">
      <rect x="-39" y="-25" width="78" height="61" rx="8" fill="#244e4310" transform="translate(3 4)"/>
      <rect x="-39" y="-25" width="78" height="61" rx="8" fill="#fff9ea" stroke="#a6b49d" stroke-width="2"/>
      <rect x="-29" y="-15" width="58" height="13" rx="4" fill="#c2daca"/>
      <path d="M-40 3h80l-4 13h-72Z" fill="#a8ccbc" stroke="#86a995" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-26 4v11m13-11v11M0 4v11M13 4v11M26 4v11" stroke="#edf2dc" stroke-width="6"/>
      <path d="M-26 36V22h18v14m19 0V22h15v14" fill="#d5e8df" stroke="#a1b6a6" stroke-width="1.8"/>
    </g>
  </defs>

  <path fill="#f4f5e9" d="M0 0h960v680H0z"/>
  <path fill="#e9f2e5" d="M0 0h480v680H0z"/>
  <path fill="url(#grass)" opacity=".45" d="M0 0h960v680H0z"/>

  <!-- Building plots stay at least 24 units away from every road centre. -->
  <g fill="#e0ead8" stroke="#d3dfca" stroke-width="1.5">
    <rect x="111" y="122" width="138" height="107" rx="18"/>
    <rect x="312" y="122" width="136" height="107" rx="18"/>
    <rect x="512" y="122" width="136" height="107" rx="18"/>
    <rect x="712" y="122" width="136" height="107" rx="18" fill="#ecebd9"/>
    <rect x="111" y="292" width="138" height="107" rx="18"/>
    <rect x="312" y="292" width="136" height="107" rx="18"/>
    <rect x="512" y="292" width="136" height="107" rx="18" fill="#ecebd9"/>
    <rect x="712" y="292" width="136" height="107" rx="18" fill="#ecebd9"/>
    <rect x="111" y="462" width="138" height="107" rx="18"/>
    <rect x="312" y="462" width="136" height="107" rx="18"/>
    <rect x="512" y="462" width="136" height="107" rx="18"/>
    <rect x="712" y="462" width="136" height="107" rx="18" fill="#ecebd9"/>
  </g>

  <!-- One connected graph. All edges are straight road-centre segments. -->
  <g fill="none" stroke-linecap="round">
    <path d="M80 90H880M80 260H880M80 430H880M80 600H880M80 90V600M280 90V600M480 90V600M680 90V600M880 90V600" stroke="#cbd9c8" stroke-width="46"/>
    <path d="M80 90H880M80 260H880M80 430H880M80 600H880M80 90V600M280 90V600M480 90V600M680 90V600M880 90V600" stroke="#fffdf5" stroke-width="34"/>
  </g>

  <!-- A few rounded buildings keep the map readable behind live order badges. -->
  <use href="#shop" x="178" y="173"/>
  <use href="#little-tree" x="230" y="143"/>
  <use href="#little-tree" x="124" y="206"/>
  <use href="#home" x="355" y="169"/>
  <use href="#home" x="412" y="195"/>
  <use href="#little-tree" x="423" y="140"/>
  <use href="#shop" x="579" y="173"/>
  <use href="#little-tree" x="630" y="207"/>
  <use href="#home" x="756" y="169"/>
  <use href="#home" x="813" y="195"/>
  <use href="#little-tree" x="824" y="140"/>

  <use href="#home" x="153" y="339"/>
  <use href="#home" x="211" y="366"/>
  <use href="#little-tree" x="222" y="311"/>
  <g stroke="#a4c4b5" stroke-width="2">
    <rect x="333" y="309" width="95" height="72" rx="11" fill="#c6dfd0"/>
    <rect x="343" y="319" width="75" height="52" rx="5" fill="none" stroke="#f6faed"/>
    <path d="M380.5 319v52" stroke="#f6faed"/>
    <circle cx="380.5" cy="345" r="11" fill="none" stroke="#f6faed"/>
  </g>
  <use href="#little-tree" x="322" y="389"/>
  <use href="#little-tree" x="438" y="302"/>
  <use href="#home" x="555" y="338"/>
  <use href="#home" x="613" y="365"/>
  <use href="#little-tree" x="625" y="311"/>
  <use href="#shop" x="780" y="344"/>
  <use href="#little-tree" x="729" y="378"/>
  <use href="#little-tree" x="833" y="312"/>

  <use href="#shop" x="179" y="514"/>
  <use href="#little-tree" x="231" y="484"/>
  <use href="#little-tree" x="124" y="547"/>
  <g>
    <path d="M328 549c31-41 58-16 99-68" fill="none" stroke="#f7f4df" stroke-width="11" stroke-linecap="round"/>
    <use href="#tree" x="343" y="487"/>
    <use href="#tree" x="412" y="536"/>
    <use href="#bench" x="376" y="548"/>
  </g>
  <g>
    <path d="M528 484c38 32 51-3 103 59" fill="none" stroke="#f7f4df" stroke-width="11" stroke-linecap="round"/>
    <ellipse cx="574" cy="526" rx="25" ry="15" fill="#bfddd4" stroke="#a3c9bf" stroke-width="2"/>
    <path d="M563 525h12m-4 7h12" stroke="#e5f4e9" stroke-width="2" stroke-linecap="round"/>
    <use href="#tree" x="622" y="487"/>
    <use href="#tree" x="536" y="546"/>
  </g>
  <use href="#home" x="756" y="509"/>
  <use href="#home" x="813" y="536"/>
  <use href="#little-tree" x="824" y="481"/>

  <!-- Border greenery never covers an intersection or an edge. -->
  <g opacity=".85">
    <use href="#tree" x="34" y="149"/>
    <use href="#tree" x="34" y="331"/>
    <use href="#tree" x="34" y="522"/>
    <use href="#tree" x="926" y="166"/>
    <use href="#tree" x="926" y="354"/>
    <use href="#tree" x="926" y="536"/>
    <use href="#little-tree" x="175" y="43"/>
    <use href="#little-tree" x="380" y="43"/>
    <use href="#little-tree" x="580" y="43"/>
    <use href="#little-tree" x="780" y="43"/>
    <use href="#little-tree" x="177" y="647"/>
    <use href="#little-tree" x="380" y="647"/>
    <use href="#little-tree" x="580" y="647"/>
    <use href="#little-tree" x="780" y="647"/>
  </g>
</svg>
