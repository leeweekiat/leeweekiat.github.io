<svg xmlns="http://www.w3.org/2000/svg" width="120" height="108" viewBox="0 0 120 108" role="img" aria-labelledby="courier-title courier-desc">
  <title id="courier-title">The Dispatch Dash bicycle courier</title>
  <desc id="courier-desc">A small, round, pale-brown otter with a rounded body, cream tummy, rosy cheeks and a mint delivery box cycles to the right. Both knees bend forward and the feet follow opposite pedals. Reduced-motion preferences show a still cycling pose.</desc>
  <style>
    .spokes { animation: wheel-turn 1.1s linear infinite; transform-box: view-box; }
    .back-spokes { transform-origin: 27px 84px; }
    .front-spokes { transform-origin: 94px 84px; }
    .still-pedals { display: none; }
    @keyframes wheel-turn { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spokes { animation: none; }
      .animated-pedals { display: none; }
      .still-pedals { display: inline; }
    }
  </style>
  <ellipse cx="61" cy="101" rx="49" ry="4" fill="#274d3e18"/>
  <g fill="none" stroke="#244b41" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="3.7" fill="#fffef4">
      <circle cx="27" cy="84" r="17"/>
      <circle cx="94" cy="84" r="17"/>
    </g>
    <g stroke="#9cb9a6" stroke-width="1.4">
      <g class="spokes back-spokes"><path d="M11 84h32M27 68v32m-11-27 22 22m-22 0 22-22"/></g>
      <g class="spokes front-spokes"><path d="M78 84h32M94 68v32m-11-27 22 22m-22 0 22-22"/></g>
    </g>
    <path d="m27 84 20-29 17 29H27m20-29h32L64 84m30 0L78 46h8m-43 9h12" stroke-width="3.5"/>
  </g>
