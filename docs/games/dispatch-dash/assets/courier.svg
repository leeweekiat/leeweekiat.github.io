  <path d="M54 53c-10 1-11 11-27 10-7-1-10-7-6-10 5-3 9 2 16-3l12-6" fill="#c8a481" stroke="#244b41" stroke-width="3.2" stroke-linejoin="round"/>
  <rect x="17" y="37" width="25" height="25" rx="6" fill="#a6d4bd" stroke="#244b41" stroke-width="3"/>
  <path d="M17 46h25m-16-8v8h7v-8" fill="none" stroke="#244b41" stroke-width="2.3" stroke-linejoin="round"/>
