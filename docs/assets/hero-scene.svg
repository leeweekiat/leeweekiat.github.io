<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 600" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Cat courier following a route across the city</title><desc id="desc">A round, rosy-cheeked cat with pointed ears and a curled tail delivers ideas by scooter across an illustrated city map.</desc>
<defs>
 <linearGradient id="scoot" x1="130" y1="350" x2="415" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#ffad69"/><stop offset="1" stop-color="#f16f58"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<!-- city map background -->
<circle cx="341" cy="259" r="218" fill="#e8f4e8"/>
<path d="M-80 107C46 170 81 190 168 174s150-99 231-51 100 84 269 19" stroke="#f9fcf4" stroke-width="70" stroke-linecap="round"/>
<path d="M-11 543C78 421 175 445 242 485s160-22 232-153 113-157 199-138" stroke="#fbfbf3" stroke-width="75" stroke-linecap="round"/>
