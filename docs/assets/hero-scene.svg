<g stroke="#77978a" stroke-width="2.4" stroke-linejoin="round">
 <g><rect x="69" y="182" width="65" height="80" rx="12" fill="#d6e2d7"/><rect x="81" y="195" width="14" height="14" rx="3" fill="#f8fcf0"/><rect x="106" y="195" width="14" height="14" rx="3" fill="#f8fcf0"/><rect x="81" y="222" width="14" height="14" rx="3" fill="#f8fcf0"/><rect x="106" y="222" width="14" height="14" rx="3" fill="#f8fcf0"/></g>
 <g><rect x="470" y="228" width="80" height="97" rx="13" fill="#c5ded9"/><path d="M486 246h20m16 0h11m-47 23h20m16 0h11m-47 23h20m16 0h11" stroke="#faffef" stroke-width="8" stroke-linecap="round"/></g>
 <g><rect x="382" y="77" width="66" height="66" rx="10" fill="#ffe9ba"/><path d="M393 92h12m15 0h13m-40 24h12m15 0h13" stroke="#fffcf2" stroke-width="9" stroke-linecap="round"/></g>
</g>
